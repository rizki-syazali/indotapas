[model]
name = indohitab
description = Task TableQA Bahasa Indonesia

[dataset]
loader_path = ./tasks/indohitab.py
data_store_path = ./data
use_cache = True

[seq2seq]
constructor = seq2seq_construction.indohitab
table_truncation_max_length = 1024
expansion = 1

[evaluate]
tool = metrics.wikitq_weakly_supervised.evaluator